name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The unit tests are offline and only need the array stack, not satpy.
      - run: pip install "numpy<2" scipy opencv-python-headless pillow requests pyproj pytest
      - run: python -m pytest tests -q
